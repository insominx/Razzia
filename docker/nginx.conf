server {
    listen 3000;
    server_tokens off;

    # Log nothing per request (a long-lived container would grow the log files forever);
    # errors go to docker logs through the supervisord -g override.
    access_log off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # add_header in a location replaces inherited ones, so locations that set
    # Cache-Control include these too.
    include /etc/nginx/security-headers.conf;

    root /app/web;
    index index.html;

    # The page must be rechecked on every load, or browsers keep an old build for days
    # (no header lets Chrome guess a freshness lifetime). Built assets have hashed names.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /config-assets/ {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Client-Id $http_x_client_id;
        proxy_set_header X-File-Name $http_x_file_name;
    }
}
