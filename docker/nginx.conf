server {
    listen 3000;

    root /app/web;
    index index.html;

    # The page must be rechecked on every load, or browsers keep an old build for days
    # (no header lets Chrome guess a freshness lifetime). Built assets have hashed names.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /config-assets/ {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Client-Id $http_x_client_id;
        proxy_set_header X-File-Name $http_x_file_name;
    }
}
