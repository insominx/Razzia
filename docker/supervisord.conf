[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:nginx]
command=nginx -g "error_log /dev/stderr warn; daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:socket]
startsecs=3
startretries=999999
command=node --enable-source-maps /app/socket/index.cjs
user=node
environment=NODE_ENV="production",CONFIG_PATH="/app/config",QUIZ_SEED_PATH="/app/seed/quizz"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
